# Fly.io configuration for Zonatic API
#
# Public API hostname: api.zonatic.id
# Fly.io region: Singapore (sin)
# Internal port: 8000
# HTTPS enabled

app = "zonatic-api"
primary_region = "sin"

# Build configuration
[build]
  dockerfile = "apps/api/Dockerfile"

# Build arguments (only non-secret build-time values)
[build.args]
  # No secret material should be stored in this file.

# Runtime environment variables
[env]
  APP_ENV = "production"

# HTTP service configuration
[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["api"]
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # HTTP service configuration
  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  # HTTP health checks
  [[services.http_checks]]
    path = "/health"
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "get"
    restart_limit = 3

  # TCP health checks (backup)
  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "5s"

  # Process configuration
  [vm]
  memory_mb = 512

  [processes]
    api = "uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2"
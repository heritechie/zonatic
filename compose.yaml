services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zonatic}
      POSTGRES_USER: ${POSTGRES_USER:-zonatic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonatic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zonatic:zonatic@db:5432/zonatic}
      APP_ENV: ${APP_ENV:-development}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app:ro
      - ./examples:/app/examples:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_GRAPHQL_URL: http://localhost:8001/graphql
    volumes:
      - ./apps/console/src:/app/apps/console/src
    depends_on:
      - console-api

  console-api:
    build:
      context: .
      dockerfile: apps/console-api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://zonatic:zonatic@db:5432/zonatic}
      PORT: "8000"
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:5173,http://localhost:80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/console-api/src:/app/apps/console-api/src

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro

volumes:
  postgres_data:

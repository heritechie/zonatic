services:
  api:
    build:
      context: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a Supabase (or compatible) PostgreSQL connection string}
      APP_ENV: ${APP_ENV:-development}
    expose:
      - "8000"
    volumes:
      - ./apps/api:/srv/apps/api:ro
      - ./examples:/srv/examples:ro
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_GRAPHQL_URL: ${VITE_GRAPHQL_URL:-http://localhost:8001/graphql}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?VITE_SUPABASE_URL must be set to the Supabase project URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:?VITE_SUPABASE_ANON_KEY must be set to the Supabase anon key}
      VITE_SITE_URL: ${VITE_SITE_URL:-https://www.zonatic.id}
    volumes:
      - ./apps/console/src:/app/apps/console/src
    depends_on:
      - console-api

  console-api:
    build:
      context: .
      dockerfile: apps/console-api/Dockerfile
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a Supabase (or compatible) PostgreSQL connection string}
      PORT: "8000"
      NODE_ENV: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set to the Supabase project URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY must be set to the Supabase anon key}
    volumes:
      - ./apps/console-api/src:/app/apps/console-api/src

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    depends_on:
      - api
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
